# Firebase App Hosting ayarları (backend kök dizini: frontend/).
# Değerler Firebase projesi ve Cloud Run adresi belli olunca doldurulur.
runConfig:
  minInstances: 0
  maxInstances: 2

env:
  # FastAPI'nin Cloud Run adresi; next.config.ts /api/v1 isteklerini buraya yönlendirir.
  - variable: API_BASE_URL
    value: https://BACKEND-CLOUD-RUN-ADRESI
    availability: [BUILD, RUNTIME]

  # Gerçek backend hazır olunca 0 yapılır.
  - variable: NEXT_PUBLIC_SAHTE_VERI
    value: "1"
    availability: [BUILD, RUNTIME]

  # Firebase web ayarları (gizli değil).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: ""
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ""
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ""
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: ""
    availability: [BUILD, RUNTIME]
